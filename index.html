  <style>
    /* ============ Tokens ============ */
    :root {
      --bg: #000000;
      --surface: #0b0b0c;
      --surface-2: #121214;
      --line: rgba(255, 255, 255, .10);
      --line-2: rgba(255, 255, 255, .20);
      --text: #fafafa;
      --muted: #a1a1aa;
      --dim: #71717a;
      --blue: #168aff;
      --blue-soft: rgba(22, 138, 255, .14);
      --radius: 14px;
    }

    /* ============ Base ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4, p { margin: 0; }
    img { max-width: 100%; display: block; }
    button { font-family: inherit; }
    ::selection { background: rgba(22, 138, 255, .45); }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
    .hidden { display: none !important; }
    .accent { color: var(--blue); }

    /* ============ Background ============ */
    .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .bg-layer::before {
      content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 75%);
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 75%);
    }
    .bg-layer::after {
      content: ""; position: absolute; left: 50%; top: -20rem; width: 64rem; height: 38rem; transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(22,138,255,.16), transparent);
    }

    /* ============ Layout ============ */
    .page { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; }
    .wrap-md { max-width: 52rem; margin: 0 auto; padding: 0 1.5rem; }
    .wrap-sm { max-width: 26rem; margin: 0 auto; padding: 0 1.5rem; }
    section.block { padding: 5rem 0; }
    .eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--blue); }
    .h2 { margin-top: .75rem; font-size: 2rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
    .lead { margin-top: 1rem; max-width: 40rem; color: var(--muted); font-size: 1.0625rem; }

    /* ============ Reveal animation ============ */
    .reveal { opacity: 0; transform: translateY(14px); transition: opacity .7s ease, transform .7s ease; transition-delay: var(--d, 0s); }
    .reveal.in { opacity: 1; transform: none; }

    /* ============ Buttons / inputs ============ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem; cursor: pointer;
      border-radius: 10px; padding: .75rem 1.35rem; font-size: .9375rem; font-weight: 600; line-height: 1;
      border: 1px solid transparent; transition: background .2s, border-color .2s, transform .2s, box-shadow .2s, color .2s;
    }
    .btn-primary { background: #fff; color: #000; }
    .btn-primary:hover:not(:disabled) { background: #e4e4e7; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(22,138,255,.25); }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-blue:hover:not(:disabled) { background: #3a9bff; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--line-2); }
    .btn-ghost:hover { border-color: var(--blue); background: var(--blue-soft); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-block { width: 100%; }
    .btn-sm { padding: .55rem 1rem; font-size: .875rem; }
    .link { color: var(--blue); }
    .link:hover { text-decoration: underline; }

    .input {
      width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
      padding: .8rem 1rem; color: var(--text); font-family: inherit; font-size: 1rem; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .input::placeholder { color: var(--dim); }
    .input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    textarea.input { min-height: 130px; resize: vertical; display: block; }
    select.input option { background: #121214; color: var(--text); }
    .label { display: block; margin-bottom: .5rem; font-size: .8125rem; font-weight: 500; color: var(--muted); }

    .notice { border: 1px solid rgba(22,138,255,.35); background: var(--blue-soft); border-radius: 10px; padding: .85rem 1rem; font-size: .875rem; color: #cfe5ff; }
    .msg-err { border: 1px solid rgba(239,68,68,.35); background: rgba(239,68,68,.08); border-radius: 10px; padding: .75rem 1rem; font-size: .875rem; color: #fca5a5; }
    .msg-ok { border: 1px solid rgba(34,197,94,.35); background: rgba(34,197,94,.08); border-radius: 10px; padding: .75rem 1rem; font-size: .875rem; color: #86efac; }
    .spinner { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--blue); border-top-color: transparent; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ Header ============ */
    .site-header { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .header-inner { max-width: 72rem; margin: 0 auto; padding: .85rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: .65rem; }
    .brand img { width: 30px; height: 30px; }
    .brand-text { font-weight: 700; letter-spacing: .04em; font-size: 1rem; }
    .nav-desktop { display: none; align-items: center; gap: 1.75rem; font-size: .9rem; }
    .nav-link { color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; font: inherit; transition: color .2s; }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .menu-btn { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: .45rem; background: none; color: inherit; cursor: pointer; }
    .nav-mobile { display: none; flex-direction: column; align-items: flex-start; gap: 1rem; border-top: 1px solid var(--line); padding: 1.25rem 1.5rem; }
    .nav-mobile.open { display: flex; }
    @media (min-width: 820px) {
      .nav-desktop { display: flex; }
      .menu-btn, .nav-mobile, .nav-mobile.open { display: none; }
    }

    /* ============ Hero ============ */
    .hero { padding: 4.5rem 0 3rem; }
    .hero-grid { display: grid; gap: 3.5rem; align-items: center; }
    .hero-title { margin-top: 1.25rem; font-size: 2.75rem; font-weight: 700; letter-spacing: -.04em; line-height: 1.05; }
    .hero-sub { margin-top: 1.5rem; max-width: 34rem; color: var(--muted); font-size: 1.125rem; }
    .hero-cta { margin-top: 2.25rem; display: flex; flex-wrap: wrap; gap: .85rem; }
    .hero-note { margin-top: 1.25rem; font-size: .8125rem; color: var(--dim); }
    .orbit { position: relative; width: 100%; max-width: 21rem; aspect-ratio: 1; margin: 0 auto; }
    .ring { position: absolute; border-radius: 50%; border: 1px solid var(--line); animation: orbit 28s linear infinite; }
    .ring::after { content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 14px var(--blue); }
    .ring.r1 { inset: 0; }
    .ring.r2 { inset: 13%; animation-duration: 20s; animation-direction: reverse; }
    .ring.r3 { inset: 26%; animation-duration: 14s; }
    .ring.r3::after { background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.7); }
    @keyframes orbit { to { transform: rotate(360deg); } }
    .orbit-logo { position: absolute; inset: 38%; display: flex; align-items: center; justify-content: center; }
    .orbit-logo img { width: 100%; height: 100%; filter: drop-shadow(0 0 28px rgba(22,138,255,.55)); }
    @media (min-width: 900px) {
      .hero { padding: 6.5rem 0 4rem; }
      .hero-grid { grid-template-columns: 1.2fr .8fr; }
      .hero-title { font-size: 4.25rem; }
      .orbit { max-width: 26rem; }
    }

    /* ============ Cards / grids ============ */
    .grid-3 { margin-top: 3rem; display: grid; gap: 1rem; grid-template-columns: 1fr; }
    .card { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 1.75rem; transition: border-color .25s, transform .25s, background .25s; }
    .card:hover { border-color: rgba(22,138,255,.5); background: var(--surface-2); transform: translateY(-3px); }
    .icon { width: 2.5rem; height: 2.5rem; border-radius: 10px; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; color: var(--blue); }
    .card h3 { margin-top: 1.25rem; font-size: 1.125rem; font-weight: 600; letter-spacing: -.01em; }
    .card p { margin-top: .5rem; color: var(--muted); font-size: .9375rem; }
    @media (min-width: 820px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } .h2 { font-size: 2.5rem; } }

    .steps { margin-top: 3rem; display: grid; gap: 0; grid-template-columns: 1fr; border-top: 1px solid var(--line); }
    .step { padding: 1.75rem 0; border-bottom: 1px solid var(--line); display: grid; gap: .5rem 1.5rem; grid-template-columns: 3rem 1fr; }
    .step .n { font-size: .875rem; font-weight: 600; color: var(--blue); letter-spacing: .08em; padding-top: .2rem; }
    .step h3 { font-size: 1.125rem; font-weight: 600; }
    .step p { grid-column: 2; color: var(--muted); font-size: .9375rem; max-width: 38rem; }
    @media (min-width: 820px) {
      .steps { grid-template-columns: repeat(3, 1fr); border-top: 0; gap: 1rem; }
      .step { display: block; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.75rem; background: var(--surface); }
      .step .n { display: block; margin-bottom: 1rem; }
      .step p { margin-top: .5rem; }
    }

    .about { display: grid; gap: 2rem; align-items: center; border: 1px solid var(--line); border-radius: 20px; padding: 2rem; background: linear-gradient(180deg, var(--surface), #050505); }
    .about img.wm { width: 100%; max-width: 20rem; border-radius: 6px; }
    .about .who { margin-top: 1.5rem; font-weight: 600; }
    .about .role { color: var(--muted); font-size: .9375rem; }
    @media (min-width: 820px) { .about { grid-template-columns: .9fr 1.1fr; padding: 3rem; gap: 3rem; } }

    .cta { text-align: center; border: 1px solid var(--line); border-radius: 20px; padding: 3.5rem 1.5rem; background: radial-gradient(ellipse 70% 120% at 50% 0%, rgba(22,138,255,.14), transparent), var(--surface); }
    .cta h2 { font-size: 2rem; font-weight: 700; letter-spacing: -.03em; }
    .cta p { margin: .75rem auto 0; max-width: 30rem; color: var(--muted); }
    .cta .btn { margin-top: 2rem; }

    /* ============ Auth ============ */
    .auth-wrap { padding: 4.5rem 0; }
    .auth-card { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 2rem; display: flex; flex-direction: column; gap: 1.1rem; }
    .auth-card h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
    .auth-card .sub { margin-top: -.6rem; color: var(--muted); font-size: .9375rem; }
    .auth-foot { text-align: center; font-size: .875rem; color: var(--muted); }

    /* ============ Studio ============ */
    .page-pad { padding: 3rem 0 4rem; }
    .page-title { font-size: 2rem; font-weight: 700; letter-spacing: -.03em; }
    .page-sub { margin-top: .4rem; color: var(--muted); }
    .seg { margin-top: 2rem; display: inline-flex; border: 1px solid var(--line); border-radius: 12px; padding: .25rem; background: var(--surface); }
    .seg-btn { border: 0; background: none; color: var(--muted); padding: .55rem 1.25rem; border-radius: 9px; font-size: .9rem; font-weight: 500; cursor: pointer; transition: all .2s; }
    .seg-btn:hover { color: #fff; }
    .seg-btn.active { background: #fff; color: #000; }
    .panel { margin-top: 1.25rem; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 1.5rem; }
    .panel h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
    .panel .sub { margin-top: .25rem; color: var(--muted); font-size: .9375rem; }
    .panel textarea { margin-top: 1.25rem; }
    .counter { margin-top: .4rem; text-align: right; font-size: .75rem; color: var(--dim); }
    .row { margin-top: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .out { margin-top: 1.5rem; }
    .loading-box { max-width: 28rem; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line-2); border-radius: 14px; background: var(--surface-2); }
    .loading-bar { height: 3.25rem; border: 1px dashed var(--line-2); border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
    .result-img { width: 100%; max-width: 28rem; max-height: 560px; object-fit: contain; border-radius: 14px; border: 1px solid var(--line); background: #000; }
    audio { width: 100%; }
    .result .btn { margin-top: 1rem; }
    @media (min-width: 640px) {
      .panel { padding: 2rem; }
      .row { flex-direction: row; align-items: flex-end; }
      .row .field { width: 13rem; }
    }

    /* ============ Dashboard ============ */
    .dash-head { display: flex; flex-direction: column; gap: 1.25rem; }
    .dash-email { margin-top: .25rem; color: var(--muted); }
    .stats { margin-top: 2rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; max-width: 26rem; }
    .stat { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 1.25rem; }
    .stat .num { font-size: 2rem; font-weight: 700; letter-spacing: -.03em; }
    .stat .lbl { font-size: .875rem; color: var(--muted); }
    .filters { margin-top: 2.5rem; display: flex; gap: .5rem; }
    .filter-btn { border: 1px solid var(--line-2); background: transparent; color: var(--muted); padding: .45rem 1rem; border-radius: 999px; font-size: .85rem; text-transform: capitalize; cursor: pointer; transition: all .2s; }
    .filter-btn:hover { color: #fff; border-color: var(--blue); }
    .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
    .items-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    .item { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: .9rem; transition: border-color .25s; }
    .item:hover { border-color: rgba(22,138,255,.5); }
    .item-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
    .item-prompt { margin-top: .75rem; font-size: .875rem; color: #d4d4d8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-meta { margin-top: .75rem; display: flex; align-items: center; justify-content: space-between; font-size: .75rem; color: var(--dim); }
    .item-meta button { background: none; border: 0; cursor: pointer; font: inherit; color: var(--blue); padding: 0; }
    .item-meta button:hover { text-decoration: underline; }
    .muted { color: var(--muted); }
    @media (min-width: 640px) {
      .dash-head { flex-direction: row; align-items: flex-end; justify-content: space-between; }
      .items-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1000px) { .items-grid { grid-template-columns: repeat(3, 1fr); } }

    /* ============ Footer / 404 ============ */
    .site-footer { border-top: 1px solid var(--line); padding: 3rem 0 2.5rem; }
    .footer-inner { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; display: grid; gap: 1.5rem; }
    .footer-inner img { height: 26px; width: auto; border-radius: 3px; }
    .footer-tag { margin-top: .75rem; color: var(--muted); font-size: .9rem; }
    .footer-small { color: var(--dim); font-size: .8125rem; }
    @media (min-width: 820px) { .footer-inner { grid-template-columns: 1fr auto; align-items: end; } .footer-small { text-align: right; } }
    .nf { max-width: 36rem; margin: 0 auto; padding: 8rem 1.5rem; text-align: center; }
    .nf h1 { font-size: 4rem; font-weight: 700; letter-spacing: -.04em; }
    .nf p { margin-top: .75rem; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- API helpers (real backend calls only) ---------- */
async function callFunction(name, body) {
  if (!CONFIGURED) throw new Error(NOT_CONNECTED);
  const { data, error } = await sb.functions.invoke(name, { body });
  if (error) {
    let message = error.message;
    try {
      const parsed = await error.context.json();
      if (parsed && parsed.error) message = parsed.error;
    } catch (_) {}
    throw new Error(message);
  }
  return data;
}

async function downloadFile(url, filename) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Download failed");
  const blob = await res.blob();
  const objectUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = objectUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(objectUrl);
}

/* ---------- Reveal on scroll ---------- */
function initReveal() {
  const els = document.querySelectorAll(".reveal:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.12 });
  els.forEach((e) => io.observe(e));
}

/* ---------- Navigation ---------- */
function goSection(id) {
  const path = location.hash.slice(1) || "/";
  if (path !== "/") { pendingScroll = id; location.hash = "#/"; }
  else { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  $("#nav-mobile").classList.remove("open");
}

function renderNav() {
  const path = location.hash.slice(1) || "/";
  const link = (href, label) => `<a href="#${href}" class="nav-link ${path === href ? "active" : ""}">${label}</a>`;
  const sec = (id, label) => `<button class="nav-link" data-section="${id}">${label}</button>`;
  const html = session
    ? `${sec("capabilities", "Capabilities")}${sec("how", "How it works")}${sec("about", "About")}${link("/studio", "Studio")}${link("/dashboard", "Dashboard")}<button class="btn btn-ghost btn-sm" data-logout>Log out</button>`
    : `${sec("capabilities", "Capabilities")}${sec("how", "How it works")}${sec("about", "About")}${link("/login", "Log in")}<a href="#/signup" class="btn btn-primary btn-sm">Get started</a>`;
  $("#nav-desktop").innerHTML = html;
  $("#nav-mobile").innerHTML = html;
  $("#nav-mobile").classList.remove("open");
  document.querySelectorAll("[data-logout]").forEach((b) => b.addEventListener("click", logout));
  document.querySelectorAll("[data-section]").forEach((b) => b.addEventListener("click", () => goSection(b.dataset.section)));
}

$("#menu-btn").addEventListener("click", () => $("#nav-mobile").classList.toggle("open"));
$("#nav-mobile").addEventListener("click", (e) => { if (e.target.closest("a")) $("#nav-mobile").classList.remove("open"); });

async function logout() {
  await sb.auth.signOut();
  location.hash = "#/";
}

function viewLogin() {
  app.innerHTML = `
    <div class="wrap-sm auth-wrap">
      ${notice()}
      <form id="login-form" class="auth-card reveal">
        <h1>Welcome back</h1>
        <p class="sub">Log in to your TIME ERA AI account.</p>
        <div><label class="label" for="email">Email</label><input class="input" id="email" type="email" name="email" required autocomplete="email" /></div>
        <div><label class="label" for="password">Password</label><input class="input" id="password" type="password" name="password" required autocomplete="current-password" /></div>
        <div id="msg"></div>
        <button class="btn btn-primary btn-block" id="submit">Log in</button>
        <p class="auth-foot">New here? <a href="#/signup" class="link">Create an account</a></p>
      </form>
    </div>`;
  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = $("#submit");
    $("#msg").innerHTML = "";
    if (!CONFIGURED) { $("#msg").innerHTML = `<div class="msg-err">${NOT_CONNECTED}</div>`; return; }
    btn.disabled = true;
    btn.textContent = "Logging in...";
    const { error } = await sb.auth.signInWithPassword({ email: f.get("email"), password: f.get("password") });
    if (error) {
      $("#msg").innerHTML = `<div class="msg-err">${esc(error.message)}</div>`;
      btn.disabled = false;
      btn.textContent = "Log in";
    }
    /* On success the auth listener sends the user to the Studio. */
  });
}

function viewSignup() {
  app.innerHTML = `
    <div class="wrap-sm auth-wrap">
      ${notice()}
      <form id="signup-form" class="auth-card reveal">
        <h1>Create your account</h1>
        <p class="sub">Start generating images and voices.</p>
        <div><label class="label" for="name">Full name</label><input class="input" id="name" type="text" name="name" required autocomplete="name" /></div>
        <div><label class="label" for="email">Email</label><input class="input" id="email" type="email" name="email" required autocomplete="email" /></div>
        <div><label class="label" for="password">Password</label><input class="input" id="password" type="password" name="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password" /></div>
        <div id="msg"></div>
        <button class="btn btn-primary btn-block" id="submit">Sign up</button>
        <p class="auth-foot">Already have an account? <a href="#/login" class="link">Log in</a></p>
      </form>
    </div>`;
  $("#signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const msg = $("#msg");
    const btn = $("#submit");
    msg.innerHTML = "";
    if (!CONFIGURED) { msg.innerHTML = `<div class="msg-err">${NOT_CONNECTED}</div>`; return; }
    if (String(f.get("password")).length < 8) { msg.innerHTML = `<div class="msg-err">Password must be at least 8 characters.</div>`; return; }
    btn.disabled = true;
    btn.textContent = "Creating account...";
    const { data, error } = await sb.auth.signUp({
      email: f.get("email"),
      password: f.get("password"),
      options: { data: { full_name: f.get("name") }, emailRedirectTo: location.origin + location.pathname },
    });
    if (error) {
      msg.innerHTML = `<div class="msg-err">${esc(error.message)}</div>`;
      btn.disabled = false;
      btn.textContent = "Sign up";
    } else if (!data.session) {
      msg.innerHTML = `<div class="msg-ok">Account created. Check your email, click the confirmation link, then log in.</div>`;
      btn.textContent = "Sign up";
    }
  });
}

function viewStudio() {
  const voices = ["alloy", "ash", "coral", "echo", "fable", "nova", "onyx", "sage", "shimmer"];
  app.innerHTML = `
    <div class="wrap-md page-pad">
      ${notice()}
      <h1 class="page-title">Studio</h1>
      <p class="page-sub">Choose a tool and describe what you want to create.</p>

      <div class="seg" role="tablist">
        <button class="seg-btn active" data-tab="image" role="tab">Image</button>
        <button class="seg-btn" data-tab="voice" role="tab">Voice</button>
      </div>

      <section id="panel-image" class="panel">
        <h2>Text to Image</h2>
        <p class="sub">Describe the image you want. Be specific about subject, style and lighting.</p>
        <textarea id="img-prompt" class="input" maxlength="1000" placeholder="A minimalist product photo of a blue glass bottle on a black surface, soft studio lighting"></textarea>
        <div class="counter"><span id="img-count">0</span>/1000</div>
        <div class="row"><button id="img-btn" class="btn btn-blue" disabled>Generate image</button></div>
        <div id="img-out" class="out"></div>
      </section>

      <section id="panel-voice" class="panel hidden">
        <h2>Text to Voice</h2>
        <p class="sub">Paste your script and choose a voice.</p>
        <textarea id="voice-text" class="input" maxlength="2000" placeholder="Welcome to TIME ERA AI. Imagine more. Create without limits."></textarea>
        <div class="counter"><span id="voice-count">0</span>/2000</div>
        <div class="row">
          <div class="field">
            <label class="label" for="voice-select">Voice</label>
            <select id="voice-select" class="input">
              ${voices.map((v) => `<option value="${v}" ${v === "nova" ? "selected" : ""}>${v[0].toUpperCase() + v.slice(1)}</option>`).join("")}
            </select>
          </div>
          <button id="voice-btn" class="btn btn-blue" disabled>Generate voice</button>
        </div>
        <div id="voice-out" class="out"></div>
      </section>
    </div>`;

  /* Tabs */
  document.querySelectorAll(".seg-btn").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".seg-btn").forEach((x) => x.classList.toggle("active", x === b));
    $("#panel-image").classList.toggle("hidden", b.dataset.tab !== "image");
    $("#panel-voice").classList.toggle("hidden", b.dataset.tab !== "voice");
  }));

  /* Image tool */
  const imgPrompt = $("#img-prompt"), imgBtn = $("#img-btn"), imgOut = $("#img-out");
  imgPrompt.addEventListener("input", () => {
    $("#img-count").textContent = imgPrompt.value.length;
    imgBtn.disabled = !imgPrompt.value.trim();
  });
  imgBtn.addEventListener("click", async () => {
    const prompt = imgPrompt.value.trim();
    if (!prompt) return;
    imgBtn.disabled = true;
    imgBtn.textContent = "Generating...";
    imgOut.innerHTML = `<div class="loading-box"><div class="spinner"></div></div>`;
    try {
      const r = await callFunction("generate-image", { prompt });
      imgOut.innerHTML = `
        <div class="result">
          <img class="result-img" src="${esc(r.url)}" alt="${esc(prompt)}" />
          <button id="img-dl" class="btn btn-ghost">Download image</button>
        </div>`;
      $("#img-dl").addEventListener("click", () => downloadFile(r.url, `time-era-ai-${r.id}.png`).catch(() => alert("Download failed.")));
    } catch (e) {
      imgOut.innerHTML = `<div class="msg-err">${esc(e.message)}</div>`;
    } finally {
      imgBtn.textContent = "Generate image";
      imgBtn.disabled = !imgPrompt.value.trim();
    }
  });

  /* Voice tool */
  const vText = $("#voice-text"), vBtn = $("#voice-btn"), vOut = $("#voice-out");
  vText.addEventListener("input", () => {
    $("#voice-count").textContent = vText.value.length;
    vBtn.disabled = !vText.value.trim();
  });
  vBtn.addEventListener("click", async () => {
    const text = vText.value.trim();
    if (!text) return;
    vBtn.disabled = true;
    vBtn.textContent = "Generating...";
    vOut.innerHTML = `<div class="loading-bar"><div class="spinner" style="width:1.4rem;height:1.4rem"></div></div>`;
    try {
      const r = await callFunction("generate-voice", { text, voice: $("#voice-select").value });
      vOut.innerHTML = `
        <div class="result">
          <audio controls src="${esc(r.url)}"></audio>
          <button id="voice-dl" class="btn btn-ghost">Download audio</button>
        </div>`;
      $("#voice-dl").addEventListener("click", () => downloadFile(r.url, `time-era-ai-${r.id}.mp3`).catch(() => alert("Download failed.")));
    } catch (e) {
      vOut.innerHTML = `<div class="msg-err">${esc(e.message)}</div>`;
    } finally {
      vBtn.textContent = "Generate voice";
      vBtn.disabled = !vText.value.trim();
    }
  });
}

async function viewDashboard() {
  app.innerHTML = `
    <div class="wrap page-pad">
      ${notice()}
      <div class="dash-head">
        <div>
          <h1 class="page-title">Hello, ${esc(userName())}</h1>
          <p class="dash-email">${esc(session.user.email)}</p>
        </div>
        <a href="#/studio" class="btn btn-primary">Create something new</a>
      </div>
      <div id="stats" class="stats"></div>
      <div id="filters" class="filters"></div>
      <div id="list" style="margin-top:1.5rem"><p class="muted">Loading your creations...</p></div>
    </div>`;

  if (!CONFIGURED) { $("#list").innerHTML = ""; return; }

  let items = [];
  try {
    const { data, error } = await sb.from("generations").select("*").order("created_at", { ascending: false }).limit(60);
    if (error) throw error;
    items = data || [];
    if (items.length) {
      const { data: signed, error: e2 } = await sb.storage.from("creations").createSignedUrls(items.map((i) => i.file_path), 3600);
      if (e2) throw e2;
      items = items.map((it, i) => ({ ...it, url: (signed[i] && signed[i].signedUrl) || "" }));
    }
  } catch (e) {
    $("#list").innerHTML = `<div class="msg-err">${esc(e.message || "Could not load your creations.")}</div>`;
    return;
  }

  $("#stats").innerHTML = `
    <div class="stat"><p class="num">${items.filter((i) => i.type === "image").length}</p><p class="lbl">Images</p></div>
    <div class="stat"><p class="num">${items.filter((i) => i.type === "voice").length}</p><p class="lbl">Voice clips</p></div>`;

  let filter = "all";
  const drawFilters = () => {
    $("#filters").innerHTML = ["all", "image", "voice"].map((f) => `<button class="filter-btn ${filter === f ? "active" : ""}" data-f="${f}">${f}</button>`).join("");
    $("#filters").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; drawFilters(); drawList(); }));
  };
  const drawList = () => {
    const visible = items.filter((i) => filter === "all" || i.type === filter);
    if (!visible.length) {
      $("#list").innerHTML = `<p class="muted">Nothing here yet. Head to the Studio and make your first creation.</p>`;
      return;
    }
    $("#list").innerHTML = `<div class="items-grid">${visible.map((it) => `
      <article class="item">
        ${it.type === "image"
          ? `<img class="item-img" src="${esc(it.url)}" alt="${esc(it.prompt)}" loading="lazy" />`
          : `<audio controls src="${esc(it.url)}"></audio>`}
        <p class="item-prompt">${esc(it.prompt)}</p>
        <div class="item-meta">
          <span>${new Date(it.created_at).toLocaleDateString()}</span>
          <button data-dl="${esc(it.id)}">Download</button>
        </div>
      </article>`).join("")}</div>`;
    $("#list").querySelectorAll("[data-dl]").forEach((b) => b.addEventListener("click", () => {
      const it = items.find((x) => x.id === b.dataset.dl);
      downloadFile(it.url, `time-era-ai-${it.id}.${it.type === "image" ? "png" : "mp3"}`).catch(() => alert("Download failed."));
    }));
  };
  drawFilters();
  drawList();
}

function viewNotFound() {
  app.innerHTML = `<div class="nf"><h1>404</h1><p>This page doesn't exist.</p><p style="margin-top:1.5rem"><a href="#/" class="btn btn-ghost">Back to home</a></p></div>`;
}

/* ---------- Router ---------- */
const routes = { "/": viewHome, "/login": viewLogin, "/signup": viewSignup, "/studio": viewStudio, "/dashboard": viewDashboard };
const protectedRoutes = ["/studio", "/dashboard"];

function route() {
  const path = location.hash.slice(1) || "/";
  if (protectedRoutes.includes(path) && !session) { location.hash = "#/login"; return; }
  if ((path === "/login" || path === "/signup") && session) { location.hash = "#/studio"; return; }
  (routes[path] || viewNotFound)();
  renderNav();
  initReveal();
  if (pendingScroll) {
    const id = pendingScroll; pendingScroll = null;
    setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  } else {
    window.scrollTo(0, 0);
  }
}

window.addEventListener("hashchange", route);

sb.auth.onAuthStateChange((_event, s) => {
  const changed = (s && s.user && s.user.id) !== (session && session.user && session.user.id);
  session = s;
  renderNav();
  if (changed) route();
});

sb.auth.getSession().then(({ data }) => {
  session = data.session;
  route();
});
</script>
