<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05030f" />
  <title>TIME ERA AI | Imagine More. Create Without Limits.</title>
  <meta name="description" content="TIME ERA AI by Tillu Rajapuram. Imagine More. Create Without Limits. Generate images and voices with AI." />
  <meta property="og:title" content="TIME ERA AI" />
  <meta property="og:description" content="Imagine More. Create Without Limits." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2305030f' stroke='%238b5cf6' stroke-width='3'/%3E%3Cpath d='M18 20h28v7H36v19h-8V27H18z' fill='%233b82f6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>

  <style>
    /* ============ Base ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; background: #05030f; color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    img { max-width: 100%; display: block; }
    ::selection { background: rgba(139, 92, 246, .5); }
    .display { font-family: Orbitron, "Segoe UI", system-ui, sans-serif; }
    .hidden { display: none !important; }

    /* ============ Animations ============ */
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 20px rgba(139,92,246,.35); } 50% { box-shadow: 0 0 42px rgba(59,130,246,.65); } }
    @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-up { animation: fadeUp .8s ease-out both; }
    .pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }

    /* ============ Background ============ */
    .bg-layer { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .orb { position: absolute; border-radius: 9999px; filter: blur(120px); animation: float 6s ease-in-out infinite; }
    .orb-1 { left: -10rem; top: -10rem; width: 32rem; height: 32rem; background: rgba(139,92,246,.25); }
    .orb-2 { right: -10rem; top: 33%; width: 30rem; height: 30rem; background: rgba(59,130,246,.2); animation-delay: 2s; }
    .orb-3 { left: 33%; bottom: -10rem; width: 28rem; height: 28rem; background: rgba(139,92,246,.15); animation-delay: 4s; }
    .grid-bg {
      position: absolute; inset: 0; opacity: .07;
      background-image: linear-gradient(rgba(139,92,246,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,.6) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    /* ============ Layout ============ */
    .page { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
    .wrap-md { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; }
    .wrap-sm { max-width: 28rem; margin: 0 auto; padding: 0 1.25rem; }

    /* ============ Glass + text + buttons ============ */
    .glass {
      border-radius: 1rem; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .glow-text {
      background: linear-gradient(90deg, #8b5cf6, #3b82f6, #8b5cf6); background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: gradientShift 6s ease infinite;
    }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border: 0; cursor: pointer;
      border-radius: .75rem; padding: .75rem 1.5rem; font: inherit; font-weight: 600; color: #fff;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6); transition: all .3s;
    }
    .btn-primary:hover:not(:disabled) { transform: scale(1.03); box-shadow: 0 0 30px rgba(139,92,246,.6); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-block { width: 100%; }
    .btn-small { padding: .5rem 1.2rem; font-size: .875rem; }
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: .75rem;
      border: 1px solid rgba(255,255,255,.15); background: transparent; padding: .6rem 1.2rem;
      font: inherit; font-weight: 500; color: #e2e8f0; transition: all .3s;
    }
    .btn-ghost:hover { border-color: #8b5cf6; background: rgba(255,255,255,.05); box-shadow: 0 0 20px rgba(139,92,246,.35); }
    .link-blue { color: #3b82f6; }
    .link-blue:hover { text-decoration: underline; }

    .input {
      width: 100%; border-radius: .75rem; border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.4);
      padding: .75rem 1rem; color: #f1f5f9; outline: none; font-family: inherit; font-size: 1rem; transition: all .3s;
    }
    .input::placeholder { color: #64748b; }
    .input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,.25); }
    textarea.input { min-height: 120px; resize: vertical; display: block; margin-top: 1.25rem; }
    select.input option { background: #0d0a1f; color: #f1f5f9; }

    .msg-err { border-radius: .5rem; border: 1px solid rgba(239,68,68,.3); background: rgba(239,68,68,.1); padding: .75rem; font-size: .875rem; color: #fca5a5; }
    .msg-ok { border-radius: .5rem; border: 1px solid rgba(16,185,129,.3); background: rgba(16,185,129,.1); padding: .75rem; font-size: .875rem; color: #6ee7b7; }
    .spinner { width: 2.5rem; height: 2.5rem; border-radius: 9999px; border: 2px solid #3b82f6; border-top-color: transparent; animation: spin 1s linear infinite; }

    /* ============ Header ============ */
    .site-header { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid rgba(255,255,255,.1); background: rgba(5,3,15,.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .header-inner { max-width: 72rem; margin: 0 auto; padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: .75rem; }
    .brand-mark {
      width: 2.25rem; height: 2.25rem; border-radius: 9999px; border: 1px solid rgba(139,92,246,.6);
      display: flex; align-items: center; justify-content: center; font-size: .875rem; font-weight: 700; color: #fff;
      box-shadow: 0 0 18px rgba(139,92,246,.7);
    }
    .brand-text { font-size: 1.125rem; font-weight: 700; letter-spacing: .15em; color: #fff; }
    .nav-desktop { display: none; align-items: center; gap: 2rem; font-size: .875rem; }
    .nav-link { color: #94a3b8; transition: color .2s; background: none; border: 0; cursor: pointer; font: inherit; padding: 0; }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .menu-btn { display: inline-flex; border: 1px solid rgba(255,255,255,.15); border-radius: .5rem; padding: .5rem; background: none; color: inherit; cursor: pointer; }
    .nav-mobile { display: none; flex-direction: column; gap: 1rem; border-top: 1px solid rgba(255,255,255,.1); padding: 1.25rem; }
    .nav-mobile.open { display: flex; }
    @media (min-width: 768px) {
      .nav-desktop { display: flex; }
      .menu-btn, .nav-mobile, .nav-mobile.open { display: none; }
    }

    /* ============ Footer ============ */
    .site-footer { border-top: 1px solid rgba(255,255,255,.1); background: rgba(5,3,15,.6); padding: 2.5rem 1rem; text-align: center; font-size: .875rem; color: #64748b; }
    .site-footer .f-brand { letter-spacing: .15em; color: #cbd5e1; }

    /* ============ Home ============ */
    .hero { padding-top: 5rem; padding-bottom: 6rem; text-align: center; }
    .eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .4em; color: #3b82f6; }
    .hero-title { margin-top: 1.5rem; font-size: 2.25rem; font-weight: 900; line-height: 1.15; color: #fff; }
    .hero-sub { max-width: 42rem; margin: 1.5rem auto 0; font-size: 1rem; color: #94a3b8; }
    .hero-cta { margin-top: 2.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    .section-title { text-align: center; font-size: 1.5rem; color: #fff; }
    .features-grid { margin-top: 3rem; display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
    .feature-card { padding: 1.5rem; transition: all .3s; }
    .feature-card:hover { transform: translateY(-4px); border-color: rgba(139,92,246,.6); box-shadow: 0 0 30px rgba(139,92,246,.3); }
    .icon-box {
      width: 3rem; height: 3rem; border-radius: .75rem; display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; color: #fff; background: linear-gradient(135deg, #8b5cf6, #3b82f6); box-shadow: 0 0 20px rgba(139,92,246,.5);
    }
    .feature-card h3 { margin-top: 1.25rem; font-size: 1rem; color: #fff; }
    .feature-card p { margin-top: .5rem; font-size: .875rem; color: #94a3b8; }
    .cta-box { padding: 2rem; text-align: center; }
    .cta-box h2 { font-size: 1.5rem; color: #fff; }
    .cta-box p { margin-top: .75rem; color: #94a3b8; }
    .cta-box .btn-primary { margin-top: 2rem; }
    .sec-pad { padding-bottom: 6rem; }
    @media (min-width: 640px) {
      .hero { padding-top: 8rem; }
      .hero-title { font-size: 3.75rem; }
      .hero-sub { font-size: 1.125rem; }
      .hero-cta { flex-direction: row; }
      .section-title { font-size: 1.875rem; }
      .features-grid { grid-template-columns: repeat(2, 1fr); }
      .cta-box { padding: 3rem; }
      .cta-box h2 { font-size: 1.875rem; }
    }
    @media (min-width: 1024px) {
      .hero-title { font-size: 4.5rem; }
      .features-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* ============ Auth ============ */
    .auth-wrap { padding-top: 5rem; padding-bottom: 5rem; }
    .auth-form { padding: 2rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .auth-form h1 { text-align: center; font-size: 1.5rem; color: #fff; }
    .auth-foot { text-align: center; font-size: .875rem; color: #94a3b8; }

    /* ============ Studio ============ */
    .page-pad { padding-top: 3rem; padding-bottom: 3rem; }
    .page-title { font-size: 1.875rem; color: #fff; }
    .page-sub { margin-top: .5rem; color: #94a3b8; }
    .studio-grid { margin-top: 2.5rem; display: grid; gap: 2rem; grid-template-columns: 1fr; }
    .tool { padding: 1.5rem; }
    .tool h2 { font-size: 1.25rem; color: #fff; }
    .tool .tool-sub { margin-top: .25rem; font-size: .875rem; color: #94a3b8; }
    .counter { margin-top: .25rem; text-align: right; font-size: .75rem; color: #64748b; }
    .tool .btn-primary { margin-top: .75rem; }
    .tool-out { margin-top: 1rem; }
    .voice-row { margin-top: .75rem; display: flex; flex-direction: column; gap: .75rem; }
    .voice-row .btn-primary { margin-top: 0; }
    .loading-box { max-width: 28rem; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; border-radius: 1rem; border: 1px solid rgba(139,92,246,.4); background: rgba(0,0,0,.3); }
    .loading-bar { height: 3.5rem; border-radius: .75rem; border: 1px solid rgba(139,92,246,.4); background: rgba(0,0,0,.3); }
    .result-img { width: 100%; max-width: 28rem; max-height: 560px; object-fit: contain; border-radius: 1rem; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 0 40px rgba(139,92,246,.35); }
    .result audio, audio { width: 100%; }
    .result .btn-ghost { margin-top: 1rem; }
    @media (min-width: 640px) {
      .tool { padding: 2rem; }
      .voice-row { flex-direction: row; align-items: center; }
      .voice-row select { width: 12rem; }
    }
    @media (min-width: 1024px) {
      .studio-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ============ Dashboard ============ */
    .dash-head { display: flex; flex-direction: column; gap: 1rem; }
    .dash-email { margin-top: .25rem; color: #94a3b8; }
    .stats { margin-top: 2rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; max-width: 28rem; }
    .stat { padding: 1.25rem; }
    .stat .num { font-size: 1.875rem; color: #fff; }
    .stat .lbl { font-size: .875rem; color: #94a3b8; }
    .filters { margin-top: 2.5rem; display: flex; gap: .5rem; }
    .filter-btn { border-radius: .5rem; padding: .5rem 1rem; font: inherit; font-size: .875rem; text-transform: capitalize; cursor: pointer; border: 1px solid rgba(255,255,255,.15); color: #cbd5e1; background: transparent; transition: all .2s; }
    .filter-btn:hover { background: rgba(255,255,255,.05); }
    .filter-btn.active { background: linear-gradient(90deg, #8b5cf6, #3b82f6); color: #fff; border-color: transparent; }
    .items-grid { margin-top: 1.5rem; display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
    .item { padding: 1rem; overflow: hidden; }
    .item-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: .75rem; }
    .item-prompt { margin-top: .75rem; font-size: .875rem; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-meta { margin-top: .75rem; display: flex; align-items: center; justify-content: space-between; font-size: .75rem; color: #64748b; }
    .item-meta button { background: none; border: 0; cursor: pointer; font: inherit; color: #3b82f6; padding: 0; }
    .item-meta button:hover { text-decoration: underline; }
    .muted { color: #94a3b8; }
    @media (min-width: 640px) {
      .dash-head { flex-direction: row; align-items: flex-end; justify-content: space-between; }
      .items-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .items-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ============ 404 ============ */
    .nf { max-width: 36rem; margin: 0 auto; padding: 8rem 1.5rem; text-align: center; }
    .nf h1 { font-size: 3rem; }
    .nf p { margin-top: 1rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-bg"></div>
  </div>

  <div class="page">
    <header class="site-header">
      <div class="header-inner">
        <a href="#/" class="brand">
          <span class="brand-mark display">T</span>
          <span class="brand-text display">TIME ERA <span class="glow-text">AI</span></span>
        </a>
        <nav id="nav-desktop" class="nav-desktop"></nav>
        <button id="menu-btn" class="menu-btn" aria-label="Toggle menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
      <nav id="nav-mobile" class="nav-mobile"></nav>
    </header>

    <main id="app"></main>

    <footer class="site-footer">
      <p class="f-brand display">TIME ERA AI</p>
      <p style="margin-top:.25rem">Imagine More. Create Without Limits.</p>
      <p style="margin-top:1rem">© <span id="year"></span> TIME ERA AI. Founded by Tillu Rajapuram, Founder &amp; CEO.</p>
    </footer>
  </div>

<script>
/* ===================== CONFIG: paste your PUBLIC Supabase values ===================== */
const SUPABASE_URL = "https://YOUR-PROJECT-ID.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-PUBLIC-ANON-KEY";
/* ====================================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
let session = null;

document.getElementById("year").textContent = new Date().getFullYear();

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const userName = () => (session && session.user && session.user.user_metadata && session.user.user_metadata.full_name) || (session && session.user && session.user.email) || "Creator";

/* ---------- API helpers ---------- */
async function callFunction(name, body) {
  const { data, error } = await sb.functions.invoke(name, { body });
  if (error) {
    let message = error.message;
    try {
      const parsed = await error.context.json();
      if (parsed && parsed.error) message = parsed.error;
    } catch (_) {}
    throw new Error(message);
  }
  return data;
}

async function downloadFile(url, filename) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Download failed");
  const blob = await res.blob();
  const objectUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = objectUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(objectUrl);
}

/* ---------- Navbar ---------- */
function renderNav() {
  const path = location.hash.slice(1) || "/";
  const link = (href, label) => `<a href="#${href}" class="nav-link ${path === href ? "active" : ""}">${label}</a>`;
  const html = session
    ? `${link("/", "Home")}${link("/studio", "Studio")}${link("/dashboard", "Dashboard")}<button class="btn-ghost btn-small" data-logout>Log out</button>`
    : `${link("/", "Home")}${link("/login", "Log in")}<a href="#/signup" class="btn-primary btn-small">Get started</a>`;
  $("#nav-desktop").innerHTML = html;
  $("#nav-mobile").innerHTML = html;
  $("#nav-mobile").classList.remove("open");
  document.querySelectorAll("[data-logout]").forEach((b) => b.addEventListener("click", logout));
}

$("#menu-btn").addEventListener("click", () => $("#nav-mobile").classList.toggle("open"));
$("#nav-mobile").addEventListener("click", (e) => {
  if (e.target.closest("a,button")) $("#nav-mobile").classList.remove("open");
});

async function logout() {
  await sb.auth.signOut();
  location.hash = "#/";
}

/* ---------- Pages ---------- */
function viewHome() {
  const features = [
    ["✦", "Text to Image", "Turn a single sentence into stunning, original artwork in seconds."],
    ["◉", "Text to Voice", "Convert any script into natural, expressive speech with multiple voices."],
    ["⬇", "Download Everything", "Save your images and audio and use them anywhere you like."],
    ["❖", "Your Personal Dashboard", "Every creation is saved to your account, ready whenever you are."],
  ];
  const cta = session ? "#/studio" : "#/signup";
  app.innerHTML = `
    <section class="wrap hero">
      <p class="eyebrow fade-up">The future of creation</p>
      <h1 class="hero-title display fade-up" style="animation-delay:.1s">
        Imagine More.<br /><span class="glow-text">Create Without Limits.</span>
      </h1>
      <p class="hero-sub fade-up" style="animation-delay:.25s">
        TIME ERA AI brings powerful image and voice generation into one beautiful studio. Type an idea and watch it come alive.
      </p>
      <div class="hero-cta fade-up" style="animation-delay:.4s">
        <a href="${cta}" class="btn-primary pulse-glow">${session ? "Open the Studio" : "Start creating free"}</a>
        ${session ? "" : `<a href="#/login" class="btn-ghost">I already have an account</a>`}
      </div>
    </section>

    <section class="wrap sec-pad">
      <h2 class="section-title display">Everything you need to <span class="glow-text">create</span></h2>
      <div class="features-grid">
        ${features.map(([icon, title, body], i) => `
          <div class="glass feature-card fade-up" style="animation-delay:${0.1 * i}s">
            <div class="icon-box">${icon}</div>
            <h3 class="display">${title}</h3>
            <p>${body}</p>
          </div>`).join("")}
      </div>
    </section>

    <section class="wrap-md sec-pad">
      <div class="glass cta-box pulse-glow">
        <h2 class="display">Ready to enter the new era?</h2>
        <p>Create your free account and generate your first image or voice today.</p>
        <a href="${cta}" class="btn-primary">${session ? "Go to the Studio" : "Create my account"}</a>
      </div>
    </section>`;
}

function viewLogin() {
  app.innerHTML = `
    <div class="wrap-sm auth-wrap">
      <form id="login-form" class="glass auth-form fade-up">
        <h1 class="display">Welcome back</h1>
        <input class="input" type="email" name="email" required placeholder="Email" autocomplete="email" />
        <input class="input" type="password" name="password" required placeholder="Password" autocomplete="current-password" />
        <div id="msg"></div>
        <button class="btn-primary btn-block" id="submit">Log in</button>
        <p class="auth-foot">New here? <a href="#/signup" class="link-blue">Create an account</a></p>
      </form>
    </div>`;
  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = $("#submit");
    btn.disabled = true;
    btn.textContent = "Logging in...";
    $("#msg").innerHTML = "";
    const { error } = await sb.auth.signInWithPassword({ email: f.get("email"), password: f.get("password") });
    if (error) {
      $("#msg").innerHTML = `<div class="msg-err">${esc(error.message)}</div>`;
      btn.disabled = false;
      btn.textContent = "Log in";
    }
    /* On success the auth listener sends the user to the Studio. */
  });
}

function viewSignup() {
  app.innerHTML = `
    <div class="wrap-sm auth-wrap">
      <form id="signup-form" class="glass auth-form fade-up">
        <h1 class="display">Join TIME ERA AI</h1>
        <input class="input" type="text" name="name" required placeholder="Full name" autocomplete="name" />
        <input class="input" type="email" name="email" required placeholder="Email" autocomplete="email" />
        <input class="input" type="password" name="password" required placeholder="Password (8+ characters)" autocomplete="new-password" />
        <div id="msg"></div>
        <button class="btn-primary btn-block" id="submit">Sign up</button>
        <p class="auth-foot">Already have an account? <a href="#/login" class="link-blue">Log in</a></p>
      </form>
    </div>`;
  $("#signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const msg = $("#msg");
    const btn = $("#submit");
    if (String(f.get("password")).length < 8) {
      msg.innerHTML = `<div class="msg-err">Password must be at least 8 characters.</div>`;
      return;
    }
    btn.disabled = true;
    btn.textContent = "Creating account...";
    msg.innerHTML = "";
    const { data, error } = await sb.auth.signUp({
      email: f.get("email"),
      password: f.get("password"),
      options: { data: { full_name: f.get("name") }, emailRedirectTo: location.origin + location.pathname },
    });
    if (error) {
      msg.innerHTML = `<div class="msg-err">${esc(error.message)}</div>`;
      btn.disabled = false;
      btn.textContent = "Sign up";
    } else if (!data.session) {
      msg.innerHTML = `<div class="msg-ok">Account created! Check your email, click the confirmation link, then log in.</div>`;
      btn.textContent = "Sign up";
    }
  });
}

function viewStudio() {
  const voices = ["alloy", "ash", "coral", "echo", "fable", "nova", "onyx", "sage", "shimmer"];
  app.innerHTML = `
    <div class="wrap page-pad">
      <h1 class="page-title display">The <span class="glow-text">Studio</span></h1>
      <p class="page-sub">Pick a tool and start creating.</p>
      <div class="studio-grid">
        <section class="glass tool">
          <h2 class="display">Text to Image</h2>
          <p class="tool-sub">Describe anything. TIME ERA AI paints it.</p>
          <textarea id="img-prompt" class="input" maxlength="1000" placeholder="A neon-lit samurai standing in a futuristic rainy city, cinematic, ultra detailed..."></textarea>
          <div class="counter"><span id="img-count">0</span>/1000</div>
          <button id="img-btn" class="btn-primary" disabled>Generate image</button>
          <div id="img-out" class="tool-out"></div>
        </section>

        <section class="glass tool">
          <h2 class="display">Text to Voice</h2>
          <p class="tool-sub">Turn your words into natural speech.</p>
          <textarea id="voice-text" class="input" maxlength="2000" placeholder="Welcome to TIME ERA AI. Imagine more. Create without limits."></textarea>
          <div class="counter"><span id="voice-count">0</span>/2000</div>
          <div class="voice-row">
            <select id="voice-select" class="input" aria-label="Voice">
              ${voices.map((v) => `<option value="${v}" ${v === "nova" ? "selected" : ""}>${v[0].toUpperCase() + v.slice(1)}</option>`).join("")}
            </select>
            <button id="voice-btn" class="btn-primary" disabled>Generate voice</button>
          </div>
          <div id="voice-out" class="tool-out"></div>
        </section>
      </div>
    </div>`;

  /* Image tool */
  const imgPrompt = $("#img-prompt"), imgBtn = $("#img-btn"), imgOut = $("#img-out");
  imgPrompt.addEventListener("input", () => {
    $("#img-count").textContent = imgPrompt.value.length;
    imgBtn.disabled = !imgPrompt.value.trim();
  });
  imgBtn.addEventListener("click", async () => {
    const prompt = imgPrompt.value.trim();
    if (!prompt) return;
    imgBtn.disabled = true;
    imgBtn.textContent = "Generating...";
    imgOut.innerHTML = `<div class="loading-box pulse-glow"><div class="spinner"></div></div>`;
    try {
      const r = await callFunction("generate-image", { prompt });
      imgOut.innerHTML = `
        <div class="result fade-up">
          <img class="result-img" src="${esc(r.url)}" alt="${esc(prompt)}" />
          <button id="img-dl" class="btn-ghost">Download image</button>
        </div>`;
      $("#img-dl").addEventListener("click", () => downloadFile(r.url, `time-era-ai-${r.id}.png`).catch(() => alert("Download failed.")));
    } catch (e) {
      imgOut.innerHTML = `<div class="msg-err">${esc(e.message)}</div>`;
    } finally {
      imgBtn.textContent = "Generate image";
      imgBtn.disabled = !imgPrompt.value.trim();
    }
  });

  /* Voice tool */
  const vText = $("#voice-text"), vBtn = $("#voice-btn"), vOut = $("#voice-out");
  vText.addEventListener("input", () => {
    $("#voice-count").textContent = vText.value.length;
    vBtn.disabled = !vText.value.trim();
  });
  vBtn.addEventListener("click", async () => {
    const text = vText.value.trim();
    if (!text) return;
    vBtn.disabled = true;
    vBtn.textContent = "Generating...";
    vOut.innerHTML = `<div class="loading-bar pulse-glow"></div>`;
    try {
      const r = await callFunction("generate-voice", { text, voice: $("#voice-select").value });
      vOut.innerHTML = `
        <div class="result fade-up">
          <audio controls src="${esc(r.url)}"></audio>
          <button id="voice-dl" class="btn-ghost">Download audio</button>
        </div>`;
      $("#voice-dl").addEventListener("click", () => downloadFile(r.url, `time-era-ai-${r.id}.mp3`).catch(() => alert("Download failed.")));
    } catch (e) {
      vOut.innerHTML = `<div class="msg-err">${esc(e.message)}</div>`;
    } finally {
      vBtn.textContent = "Generate voice";
      vBtn.disabled = !vText.value.trim();
    }
  });
}

async function viewDashboard() {
  app.innerHTML = `
    <div class="wrap page-pad">
      <div class="dash-head">
        <div>
          <h1 class="page-title display">Hello, <span class="glow-text">${esc(userName())}</span></h1>
          <p class="dash-email">${esc(session.user.email)}</p>
        </div>
        <a href="#/studio" class="btn-primary">Create something new</a>
      </div>
      <div id="stats" class="stats"></div>
      <div id="filters" class="filters"></div>
      <div id="list" style="margin-top:1.5rem"><p class="muted">Loading your creations...</p></div>
    </div>`;

  let items = [];
  try {
    const { data, error } = await sb.from("generations").select("*").order("created_at", { ascending: false }).limit(60);
    if (error) throw error;
    items = data || [];
    if (items.length) {
      const { data: signed, error: e2 } = await sb.storage.from("creations").createSignedUrls(items.map((i) => i.file_path), 3600);
      if (e2) throw e2;
      items = items.map((it, i) => ({ ...it, url: (signed[i] && signed[i].signedUrl) || "" }));
    }
  } catch (e) {
    $("#list").innerHTML = `<div class="msg-err">${esc(e.message || "Could not load your creations.")}</div>`;
    return;
  }

  $("#stats").innerHTML = `
    <div class="glass stat"><p class="num display">${items.filter((i) => i.type === "image").length}</p><p class="lbl">Images</p></div>
    <div class="glass stat"><p class="num display">${items.filter((i) => i.type === "voice").length}</p><p class="lbl">Voice clips</p></div>`;

  let filter = "all";
  const drawFilters = () => {
    $("#filters").innerHTML = ["all", "image", "voice"].map((f) => `<button class="filter-btn ${filter === f ? "active" : ""}" data-f="${f}">${f}</button>`).join("");
    $("#filters").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; drawFilters(); drawList(); }));
  };
  const drawList = () => {
    const visible = items.filter((i) => filter === "all" || i.type === filter);
    if (!visible.length) {
      $("#list").innerHTML = `<p class="muted">Nothing here yet. Head to the Studio and make your first creation.</p>`;
      return;
    }
    $("#list").innerHTML = `<div class="items-grid" style="margin-top:0">${visible.map((it) => `
      <article class="glass item fade-up">
        ${it.type === "image"
          ? `<img class="item-img" src="${esc(it.url)}" alt="${esc(it.prompt)}" loading="lazy" />`
          : `<audio controls src="${esc(it.url)}"></audio>`}
        <p class="item-prompt">${esc(it.prompt)}</p>
        <div class="item-meta">
          <span>${new Date(it.created_at).toLocaleDateString()}</span>
          <button data-dl="${esc(it.id)}">Download</button>
        </div>
      </article>`).join("")}</div>`;
    $("#list").querySelectorAll("[data-dl]").forEach((b) => b.addEventListener("click", () => {
      const it = items.find((x) => x.id === b.dataset.dl);
      downloadFile(it.url, `time-era-ai-${it.id}.${it.type === "image" ? "png" : "mp3"}`).catch(() => alert("Download failed."));
    }));
  };
  drawFilters();
  drawList();
}

function viewNotFound() {
  app.innerHTML = `<div class="nf"><h1 class="display glow-text">404</h1><p>This page doesn't exist in this era.</p></div>`;
}

/* ---------- Router ---------- */
const routes = { "/": viewHome, "/login": viewLogin, "/signup": viewSignup, "/studio": viewStudio, "/dashboard": viewDashboard };
const protectedRoutes = ["/studio", "/dashboard"];

function route() {
  const path = location.hash.slice(1) || "/";
  if (protectedRoutes.includes(path) && !session) { location.hash = "#/login"; return; }
  if ((path === "/login" || path === "/signup") && session) { location.hash = "#/studio"; return; }
  (routes[path] || viewNotFound)();
  renderNav();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);

sb.auth.onAuthStateChange((_event, s) => {
  const changed = (s && s.user && s.user.id) !== (session && session.user && session.user.id);
  session = s;
  renderNav();
  if (changed) route();
});

sb.auth.getSession().then(({ data }) => {
  session = data.session;
  route();
});
</script>
